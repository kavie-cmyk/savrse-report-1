name: P24-11R-V Visual Storytelling Restoration

on:
  push:
    paths:
      - '.github/workflows/p24-11rv-visual-restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore CEO visual storytelling
        run: |
          cat > /tmp/p24_11rv.b64 <<'PAYLOAD'
          
          
          
          
          PAYLOAD
          tr -d '[:space:]' < /tmp/p24_11rv.b64 | base64 -d | gzip -d > index.html

      - name: QA visual integrity
        run: |
          grep -q 'VISUAL K1 — OVERVIEW' index.html
          grep -q 'VISUAL K5 — Bài test quyết định' index.html
          grep -q 'REFERENCE / BENCHMARK' index.html
          grep -q 'CONCEPT ILLUSTRATION' index.html
          grep -q 'FLOW DESK' index.html
          grep -q 'TRAJECTORY TEMPLE' index.html
          grep -q 'MUSIC WORLD: <span>TIẾP TỤC PAUSE' index.html
          grep -q '0/25 — NOT PROVEN' index.html
          grep -q 'UNKNOWN / INSUFFICIENT' index.html
          for f in assets/images/bench/labster.png assets/images/bench/xvr.png assets/images/bench/cesium.jpg assets/images/bench/beatsaber.jpg assets/images/bench/walkabout.jpg assets/images/bench/demeo.webp; do test -s "$f"; done
          node --check app.js

      - name: Commit visual restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore CEO visual storytelling and concept explanations"
          git push origin HEAD:main
