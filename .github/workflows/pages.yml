name: Deploy Savrse Report to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload static site
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment status
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > DEPLOYMENT_STATUS.txt <<EOF
          GitHub Pages deployment status
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Configure Pages: ${CONFIGURE_OUTCOME}
          Upload artifact: ${UPLOAD_OUTCOME}
          Deploy Pages: ${DEPLOY_OUTCOME}
          Page URL: ${PAGE_URL}
          Expected URL: https://kavie-cmyk.github.io/savrse-report-1/
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record GitHub Pages deployment status"
            git push origin HEAD:main
          fi

