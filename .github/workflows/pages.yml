name: Deploy Savrse Report to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GitHub Pages site exists
        id: pages_init
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "201" ] || [ "$status" = "409" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages site ready (HTTP $status)."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Could not create/confirm Pages site (HTTP $status):"
            cat /tmp/pages-create.json
          fi

      - name: Configure Pages
        id: configure
        if: steps.pages_init.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload static site
        id: upload
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment status
        if: always()
        env:
          INIT_HTTP: ${{ steps.pages_init.outputs.http_status }}
          INIT_READY: ${{ steps.pages_init.outputs.ready }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > DEPLOYMENT_STATUS.txt <<EOF
          GitHub Pages deployment status
          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Pages init HTTP: ${INIT_HTTP}
          Pages init ready: ${INIT_READY}
          Configure Pages: ${CONFIGURE_OUTCOME}
          Upload artifact: ${UPLOAD_OUTCOME}
          Deploy Pages: ${DEPLOY_OUTCOME}
          Page URL: ${PAGE_URL}
          Expected URL: https://kavie-cmyk.github.io/savrse-report-1/
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record GitHub Pages deployment status"
            git push origin HEAD:main
          fi
